[package]
name = "shadertool-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM utilities for Shadertool: WGSL validation (naga) and CPU noise precompute"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# naga for WGSL validation — better error messages than browser-native
naga = { version = "24", features = ["wgsl-in", "valid"] }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
opt-level = "s"     # Optimize for size
lto = true
